name: customer
description: "சிட்டை — உங்கள் ஊர் கடைகள், உங்கள் கையில் (customer app)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#00a884"
  adaptive_icon_foreground: "assets/icon_fg.png"
